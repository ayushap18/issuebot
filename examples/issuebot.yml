# Copy to .github/workflows/issuebot.yml in the repo you want triaged.
name: issuebot
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: write   # only used in label/comment modes
concurrency:      # a spam burst queues instead of fanning out
  group: issuebot-${{ github.repository }}
  cancel-in-progress: false
jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: ayushap18/issuebot@v1
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          # settings live in .github/issuebot.toml (see examples/issuebot.toml); inputs set here override it
