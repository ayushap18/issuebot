[project]
name = "issuebot"
version = "0.1.0"
description = "Triage GitHub issues and draft maintainer replies, with a leakage-free eval harness."
requires-python = ">=3.13"
dependencies = ["anthropic>=1.11.0"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["issuebot"]
