name: issuebot
description: Triage new issues and draft replies with your own Anthropic key. Shadow mode by default (posts nothing).
branding:
  icon: tag
  color: blue
# Job needs permissions: { issues: write, contents: read } and an actions/checkout step (persist-credentials: false).
# ISSUEBOT_DRY_RUN=1 in the step env runs guards + config + prompt only (no model or write calls);
# ISSUEBOT_EVENT overrides the event payload path (used by this repo's smoke test).
inputs:
  anthropic-api-key:
    required: true
  github-token:
    default: ${{ github.token }}
  config-path:
    default: ""
    description: "Repo config TOML, relative to the checkout. Default .github/issuebot.toml (optional file)"
  mode:
    default: ""
    description: "shadow | label | comment. Blank = config file, else shadow"
  model:
    default: claude-sonnet-5-5
  min-confidence:
    default: ""
    description: "Blank = config file, else 0.8"
  label-map:
    default: ""
    description: 'JSON, e.g. {"bug":"bug"}. Mapped labels apply verbatim, others as label_prefix + label (default bot:). Blank = config file'
  max-steps:
    default: "8"
  routed:
    default: ""
    description: "true = Haiku triage first, Sonnet drafts only when unsure or the label needs a reply. Blank = config file, else false"
  threshold:
    default: ""
    description: "Blank = config file, else 0.8"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.13"
    - shell: bash
      run: pip install -q "${{ github.action_path }}"
    - shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        ISSUEBOT_CONFIG: ${{ inputs.config-path }}
        ISSUEBOT_MODE: ${{ inputs.mode }}
        ISSUEBOT_MODEL: ${{ inputs.model }}
        ISSUEBOT_MIN_CONFIDENCE: ${{ inputs.min-confidence }}
        ISSUEBOT_LABEL_MAP: ${{ inputs.label-map }}
        ISSUEBOT_MAX_STEPS: ${{ inputs.max-steps }}
        ISSUEBOT_ROUTED: ${{ inputs.routed }}
        ISSUEBOT_THRESHOLD: ${{ inputs.threshold }}
      run: python -m issuebot.agent --event "${ISSUEBOT_EVENT:-$GITHUB_EVENT_PATH}" --repo-dir "$GITHUB_WORKSPACE"
