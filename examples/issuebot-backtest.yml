# Copy to .github/workflows/issuebot-backtest.yml, then run it from the Actions tab.
# Scores issuebot on your repo's last N closed issues (with a maintainer reply) before you install it.
# Spends roughly $0.05-0.09 per issue on your ANTHROPIC_API_KEY. Public repos only (the clone is anonymous).
name: issuebot-backtest
on:
  workflow_dispatch:
    inputs:
      n:
        description: "Closed issues to backtest"
        type: choice
        options: ["25", "50", "100", "200"]
        default: "100"
permissions:
  contents: read
  issues: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -q "git+https://github.com/ayushap18/issuebot@v1.1.0"  # needs v1.1.0+; pin a full commit SHA for reproducible runs
      - uses: actions/cache@v4   # issue corpus JSON, refreshed incrementally
        with:
          path: cache
          key: issuebot-${{ github.repository }}-${{ github.run_id }}
          restore-keys: issuebot-${{ github.repository }}-
      - env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          N: ${{ inputs.n }}
        run: python -m issuebot.backtest "$GITHUB_REPOSITORY" --n "$N"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issuebot-backtest
          path: results/backtest-*.json
          if-no-files-found: ignore
